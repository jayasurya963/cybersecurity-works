<!DOCTYPE html>
<html>
<head>
    <title>OSINT Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        input, button { padding: 12px; font-size: 18px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        .history { margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕵️ OSINT Dashboard</h1>
        <form action="/scan" method="POST">
            <input type="text" name="target" placeholder="example.com" required style="width:70%"/>
            <button type="submit">🚀 Start OSINT Scan</button>
        </form>

        <div class="history">
            <h2>Recent Scans</h2>
            <ul>
            {% for item in history %}
                <li><a href="/scan?target={{ item.target }}">{{ item.target }}</a> - {{ item.timestamp }}</li>
            {% endfor %}
            </ul>
            <a href="/history">View Full History →</a>
        </div>
    </div>
</body>
</html>
